# Cabeceras de seguridad (LT4-30). Se incluyen en CADA location de nginx.conf:
# si un location tiene algun add_header, Nginx ignora los add_header del bloque server.
#
# CSP: solo scripts de nuestro origen y conexiones a nuestro origen + el gateway.
# Aunque se inyectara un script (XSS), no podria enviar el token a otro servidor.
# Si cambia la URL del gateway, actualizar connect-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:8066; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# El navegador no "adivina" el tipo de archivo
add_header X-Content-Type-Options "nosniff" always;
# No se envia la URL de nuestra app a otros sitios
add_header Referrer-Policy "no-referrer" always;
# Nadie puede mostrar la app dentro de un iframe (clickjacking)
add_header X-Frame-Options "DENY" always;
