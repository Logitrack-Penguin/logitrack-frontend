# Configuracion de Nginx para servir la SPA de LogiTrack (LT4-30)
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Comprime HTML/JS/CSS para que la descarga sea mas liviana
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Archivos generados por Vite: el nombre incluye un hash que cambia en cada build,
  # por eso se pueden guardar en cache un anio.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Todo lo demas -> la SPA.
  # Si alguien recarga en /envios/123, ese archivo no existe en disco:
  # se devuelve index.html y React Router dibuja la pantalla correcta.
  # index.html nunca se cachea, asi un despliegue nuevo se ve enseguida.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
